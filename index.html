<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自作デスク — 電子工作・DIY・自作PCの記録と段取り</title>
<meta name="description" content="暮らしを便利にする電子工作・スマートホーム・DIY・自作PCなど、自作したものの記録と段取りをまとめて管理するアプリ。部品・工具は研究デスクの台帳とつながります。">
<meta name="theme-color" content="#EEEEE9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="自作デスク">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500;700&display=swap">
<style>
/* ============================================================
   自作デスク — 自作したものの記録と段取り
   研究デスク（lab-desk）と同じ骨組み。色は :root のトークンだけで定義し、
   light / dark / OS依存 の 3 状態すべてで解決するようにしてある。
   ============================================================ */
:root{
  --bg:#EEEEE9; --grid:rgba(40,55,90,.05);
  --card:#FCFCFA; --card-2:#F3F3EF; --sunken:#E5E5DF;
  --ink:#16181C; --muted:#5E6470; --faint:#878C96;
  --line:#D4D5CE; --line-soft:#E3E3DD;
  --acc:#3B5BA9; --acc-ink:#30509A; --acc-soft:#E0E6F4; --on-acc:#FFFFFF;
  --pcb:#2D6A4E; --pcb-soft:#DAEADF;
  --warn:#94620A; --warn-soft:#F4E9CF;
  --bad:#B3261E; --bad-soft:#F6DFDC;
  --cu:#B4531F; --cu-soft:#F5E4D8;
  --shadow:0 1px 2px rgba(20,22,28,.05), 0 6px 18px rgba(20,22,28,.06);
  --shadow-lift:0 2px 6px rgba(20,22,28,.08), 0 18px 44px rgba(20,22,28,.16);
  --scrim:rgba(14,16,20,.45);
  --f-body:"IBM Plex Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
  --navh:62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101215; --grid:rgba(140,165,220,.045);
    --card:#181B20; --card-2:#1E2228; --sunken:#13161A;
    --ink:#E5E8ED; --muted:#9AA1AD; --faint:#777E8A;
    --line:#2A2F37; --line-soft:#22262D;
    --acc:#8EA8E6; --acc-ink:#A9BEF0; --acc-soft:#1B2440; --on-acc:#0C1226;
    --pcb:#72C398; --pcb-soft:#15291E;
    --warn:#DDA947; --warn-soft:#33280E;
    --bad:#F08077; --bad-soft:#3A1B19;
    --cu:#E08A55; --cu-soft:#3A2417;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.32);
    --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.5);
    --scrim:rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101215; --grid:rgba(140,165,220,.045);
  --card:#181B20; --card-2:#1E2228; --sunken:#13161A;
  --ink:#E5E8ED; --muted:#9AA1AD; --faint:#777E8A;
  --line:#2A2F37; --line-soft:#22262D;
  --acc:#8EA8E6; --acc-ink:#A9BEF0; --acc-soft:#1B2440; --on-acc:#0C1226;
  --pcb:#72C398; --pcb-soft:#15291E;
  --warn:#DDA947; --warn-soft:#33280E;
  --bad:#F08077; --bad-soft:#3A1B19;
  --cu:#E08A55; --cu-soft:#3A2417;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 8px 22px rgba(0,0,0,.32);
  --shadow-lift:0 2px 8px rgba(0,0,0,.5), 0 20px 48px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:hidden;overscroll-behavior-x:none}
html,body{margin:0;padding:0}
body{
  background-color:var(--bg); color:var(--ink);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:24px 24px; background-attachment:fixed;
  font-family:var(--f-body); font-size:15px; line-height:1.6;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  min-height:100vh; overflow-x:hidden; overscroll-behavior-x:none;
}
body.lock{overflow:hidden;position:fixed;left:0;right:0;width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
a{color:var(--acc-ink);text-decoration:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--f-mono);font-feature-settings:"zero" 1}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:12.5px}
[hidden]{display:none!important}

/* ---------- 骨組み ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
header.top{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 0 10px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line-soft);
}
header.top .wrap{display:flex;align-items:center;gap:10px;min-height:40px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em;font-size:17px}
.brand i{width:22px;height:22px;border-radius:6px;background:var(--acc);display:grid;place-items:center;flex:none}
.brand i::after{content:"";width:9px;height:9px;border:2px solid var(--on-acc);clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);border-radius:1px}
.top h1{font-size:17px;margin:0;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.iconbtn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--sunken);color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
main{padding:16px 0 calc(var(--navh) + env(safe-area-inset-bottom) + 90px)}

nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:color-mix(in srgb, var(--card) 92%, transparent);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh);padding:0 4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);font-size:11px;font-weight:500;position:relative}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a.on{color:var(--acc-ink)}
nav.tabs a .badge{position:absolute;top:7px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;font-family:var(--f-mono);font-weight:600;display:grid;place-items:center;padding:0 4px}

/* ---------- 部品 ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.sec{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec h2{font-size:13px;margin:0;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.sec .sp{flex:1}
.sec .lnk{font-size:13px;font-weight:500}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 14px;border-radius:10px;
  border:1px solid var(--line);background:var(--card);font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--card-2)}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{height:32px;padding:0 11px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunken)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

.fab{position:fixed;z-index:25;right:max(16px, calc(50% - 380px + 16px));bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 16px);
  height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--acc);color:var(--on-acc);
  display:flex;align-items:center;gap:8px;font-weight:700;box-shadow:var(--shadow-lift)}
.fab svg{width:22px;height:22px}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;font-size:11.5px;font-weight:700;letter-spacing:.03em;white-space:nowrap;
  background:var(--sunken);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.plain::before{display:none}
.st-アイデア{background:var(--sunken);color:var(--muted)}
.st-段取り中{background:var(--warn-soft);color:var(--warn)}
.st-製作中{background:var(--acc-soft);color:var(--acc-ink)}
.st-稼働中{background:var(--pcb-soft);color:var(--pcb)}
.st-保留{background:var(--sunken);color:var(--muted)}
.st-引退{background:var(--sunken);color:var(--faint)}
.pill.acc{background:var(--acc-soft);color:var(--acc-ink)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--pcb-soft);color:var(--pcb)}
.pill.cu{background:var(--cu-soft);color:var(--cu)}
.kind{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:700;background:var(--card-2);border:1px solid var(--line-soft);color:var(--muted);white-space:nowrap}

.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:500;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip b{font-family:var(--f-mono);font-weight:500;font-size:11.5px;color:var(--faint)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.on b{color:inherit;opacity:.7}
.chips + .chips{margin-top:4px}

.bar{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:3px}
.bar.done i{background:var(--pcb)}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{padding:12px 12px 10px;display:block;color:inherit}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:500}
.stat .v{font-family:var(--f-mono);font-size:20px;font-weight:600;letter-spacing:-.01em;line-height:1.3;white-space:nowrap}
.stat .v small{font-size:12px;color:var(--muted);font-weight:500;margin-left:2px}
@media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} }

.empty{text-align:center;padding:36px 20px;color:var(--muted)}
.empty .big{font-size:16px;color:var(--ink);font-weight:700;margin-bottom:6px}
.empty .btnrow{justify-content:center;margin-top:16px}

/* 作品カード */
.plist{display:grid;gap:10px}
.proj{display:flex;gap:12px;color:inherit;padding:14px 16px 13px;position:relative;overflow:hidden}
.proj:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.proj .cov{width:64px;height:64px;border-radius:10px;flex:none;object-fit:cover;background:var(--sunken);border:1px solid var(--line-soft)}
.proj .bd{flex:1;min-width:0}
.proj .hd{display:flex;align-items:flex-start;gap:8px}
.proj h3{margin:0;font-size:16px;line-height:1.45;flex:1;min-width:0}
.proj .sum{margin:4px 0 8px;color:var(--muted);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.proj .pr{display:flex;align-items:center;gap:10px}
.proj .pr .bar{flex:1}
.proj .pr .n{font-family:var(--f-mono);font-size:12px;font-weight:600;min-width:38px;text-align:right;color:var(--muted)}
.proj .meta{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;font-size:12.5px;color:var(--muted)}
.proj .meta span{display:inline-flex;align-items:center;gap:5px}
.proj .meta svg{width:14px;height:14px;opacity:.8}
.proj .meta .next{color:var(--ink)}

/* 行リスト */
.rows{padding:2px 0}
.row{display:flex;align-items:center;gap:12px;padding:11px 16px;border-top:1px solid var(--line-soft);color:inherit;min-height:52px}
.row:first-child{border-top:0}
button.row{width:100%;text-align:left}
.row:where(a,button):hover{background:var(--card-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.row .t small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.row .s{font-size:12.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.row .amt{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.row.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}

.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card)}
.chk svg{width:15px;height:15px;opacity:0;color:var(--on-acc)}
.chk.on{background:var(--pcb);border-color:var(--pcb)}
.chk.on svg{opacity:1;color:var(--card)}

.due{font-family:var(--f-mono);font-size:12px;white-space:nowrap;color:var(--muted);text-align:right}
.due.over{color:var(--bad);font-weight:600}
.due.soon{color:var(--warn);font-weight:600}
.due small{display:block;font-size:11px;color:var(--faint);font-weight:400}

/* 作品の詳細 */
.phead{padding:16px 16px 14px}
.phead .st{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.phead h2{margin:0 0 4px;font-size:20px;line-height:1.4}
.phead .pr{display:flex;align-items:center;gap:12px;margin-top:12px}
.phead .pr .bar{flex:1;height:8px;border-radius:4px}
.phead .pr .n{font-family:var(--f-mono);font-weight:600;font-size:13px;color:var(--muted)}
.seg{display:flex;gap:2px;background:var(--sunken);border-radius:11px;padding:3px;margin:14px 0 4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg a{flex:1 0 auto;text-align:center;padding:7px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg a.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg a b{font-family:var(--f-mono);font-size:11px;color:var(--faint);font-weight:500;margin-left:3px}
@media (max-width:420px){ .seg a{padding:7px 7px;font-size:12.5px} .seg a b{margin-left:1px} }

.dl{display:grid;gap:0;margin:0}
.dl > div{padding:12px 16px;border-top:1px solid var(--line-soft)}
.dl > div:first-child{border-top:0}
.dl dt{font-size:11.5px;font-weight:700;letter-spacing:.06em;color:var(--muted);margin-bottom:3px}
.dl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.dl dd.none{color:var(--faint)}
.tags{display:flex;flex-wrap:wrap;gap:5px}
.tag{font-size:12px;padding:1px 8px;border-radius:6px;background:var(--sunken);color:var(--muted)}
table.spec{width:100%;border-collapse:collapse;font-size:14px}
table.spec th,table.spec td{border-top:1px solid var(--line-soft);padding:8px 12px;text-align:left;vertical-align:top;overflow-wrap:anywhere}
table.spec tr:first-child th,table.spec tr:first-child td{border-top:0}
table.spec th{width:38%;color:var(--muted);font-weight:500;background:var(--card-2)}
table.spec td{font-family:var(--f-mono);font-size:13.5px}

.total{display:flex;align-items:baseline;gap:10px;padding:14px 16px;flex-wrap:wrap}
.total .v{font-family:var(--f-mono);font-size:24px;font-weight:600;letter-spacing:-.02em}

/* 部品表 */
.grp{margin-top:14px}
.grp h3{font-size:12.5px;font-weight:700;color:var(--muted);margin:0 2px 6px;display:flex;gap:8px;align-items:baseline;letter-spacing:.04em}
.grp h3 b{font-family:var(--f-mono);font-weight:500;color:var(--faint)}
.grp h3 .sp{flex:1}
.userow{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 16px;border-top:1px solid var(--line-soft);min-height:56px}
.userow:first-child{border-top:0}
.userow > .main{flex:1;min-width:0;text-align:left}
.userow .t{font-weight:500;line-height:1.45;overflow-wrap:anywhere}
.userow .t small{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.userow .s{font-size:12.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.userow.fin .t{color:var(--muted)}
.lab{color:var(--cu)}
.lab.short{color:var(--bad)}
.stbtn{flex:none;min-width:84px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.stbtn:hover{filter:brightness(.97)}
.stbtn svg{width:13px;height:13px}
.stbtn.s-要購入{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.stbtn.s-注文済み{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.stbtn.s-手元にある{background:var(--acc-soft);color:var(--acc-ink);border-color:transparent}
.stbtn.s-取り付け済み{background:var(--pcb-soft);color:var(--pcb);border-color:transparent}
.qty{display:flex;align-items:center;gap:2px;flex:none}
.qty .n{min-width:52px;text-align:center;font-family:var(--f-mono);font-weight:600;font-size:14px;line-height:1.1}
.qty .n small{display:block;font-family:var(--f-body);font-size:10px;color:var(--faint);font-weight:500}
.qty .n.low{color:var(--bad)}

.banner{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:0 0 10px;border-color:color-mix(in srgb,var(--cu) 40%,var(--line));background:color-mix(in srgb,var(--cu-soft) 55%,var(--card))}
.banner.info{border-color:color-mix(in srgb,var(--acc) 40%,var(--line));background:color-mix(in srgb,var(--acc-soft) 55%,var(--card))}
.banner .main{flex:1;min-width:0}
.banner b{font-size:14px}
.banner .s{font-size:12.5px;color:var(--muted)}
.linkrows{display:grid;gap:0;border:1px solid var(--line-soft);border-radius:10px;overflow:hidden}
.lrow{padding:10px 12px;border-top:1px solid var(--line-soft);display:grid;gap:4px}
.lrow:first-child{border-top:0}
.lrow .t{font-weight:600;overflow-wrap:anywhere}
.lrow .s{font-size:12px;color:var(--muted)}
.lrow select{width:100%;max-width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:8px 10px;min-height:40px}
.lrow label{display:flex;gap:8px;align-items:flex-start;cursor:pointer}
.lrow label input{width:18px;height:18px;accent-color:var(--acc);margin-top:3px;flex:none}

/* 段取り */
ol.steps{list-style:none;margin:0;padding:0}
ol.steps li{display:flex;align-items:flex-start;gap:10px;padding:10px 12px 10px 16px;border-top:1px solid var(--line-soft)}
ol.steps li:first-child{border-top:0}
ol.steps .chk{margin-top:2px}
ol.steps .main{flex:1;min-width:0;display:flex;gap:8px;text-align:left}
ol.steps .no{color:var(--acc-ink);font-weight:600;min-width:20px;font-family:var(--f-mono)}
ol.steps .tx{display:grid;gap:2px;min-width:0}
ol.steps .t{font-weight:500;overflow-wrap:anywhere}
ol.steps .b{font-size:13px;color:var(--muted);white-space:pre-wrap;overflow-wrap:anywhere}
ol.steps .m{font-size:12px;color:var(--faint);font-family:var(--f-mono)}
ol.steps .caution{color:var(--warn);font-weight:700;font-size:12px}
ol.steps li.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
ol.steps .mv{display:flex;flex-direction:column;gap:2px;flex:none}
ol.steps .mv button{width:26px;height:22px;border-radius:6px;color:var(--faint);font-size:12px}
ol.steps .mv button:hover:not(:disabled){background:var(--sunken);color:var(--ink)}
ol.steps .mv button:disabled{opacity:.25}
.prep{padding:12px 16px;display:grid;gap:6px}
.prep .ln{display:flex;gap:8px;align-items:baseline;font-size:14px}
.prep .ln b{min-width:86px;font-size:12px;color:var(--muted);font-weight:700}
.prep .ln span{flex:1;min-width:0;overflow-wrap:anywhere}
.okline{color:var(--pcb);font-weight:600}
.sess .d{width:74px;flex:none;font-family:var(--f-mono);font-size:12.5px;line-height:1.35}
.sess .d small{display:block;color:var(--muted);font-size:11px}
.sentmark{font-size:11px;color:var(--faint);white-space:nowrap}

/* 記録 */
.logadd{padding:12px 16px;display:grid;gap:8px}
.logadd textarea{min-height:70px}
.tl{padding:6px 16px 10px}
.tl .it{position:relative;padding:8px 0 12px 20px;border-left:2px solid var(--line-soft);margin-left:5px}
.tl .it::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--card);border:2px solid var(--acc)}
.tl .it.mt::before{border-color:var(--pcb)}
.tl .it .d{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tl .it .x{white-space:pre-wrap;overflow-wrap:anywhere}
.tl .it > button{position:absolute;right:0;top:6px;color:var(--faint);font-size:12px}
.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.photos img,.photos .ph{width:84px;height:84px;object-fit:cover;border-radius:8px;border:1px solid var(--line-soft);background:var(--sunken);cursor:zoom-in;display:block}
.pend{display:flex;gap:6px;flex-wrap:wrap}
.pend .pi{position:relative}
.pend img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line-soft);display:block}
.pend button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;background:var(--ink);color:var(--bg);font-size:12px;line-height:22px}

.lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.92);overflow:auto;display:grid;place-items:center}
.lightbox img{max-width:100vw;max-height:100vh;display:block}
.lightbox .x{position:fixed;top:calc(env(safe-area-inset-top) + 10px);right:12px;width:40px;height:40px;border-radius:20px;background:rgba(255,255,255,.16);color:#fff;font-size:20px;z-index:2}

/* 在庫（研究デスクの台帳） */
.search{position:relative;margin-bottom:10px}
.search input{width:100%;height:42px;border-radius:11px;border:1px solid var(--line);background:var(--card);padding:0 12px 0 38px;font-size:15px}
.search svg{position:absolute;left:12px;top:11px;width:19px;height:19px;color:var(--faint)}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 2px;flex-wrap:wrap}
.toolbar .sp{flex:1}
.toggle{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);cursor:pointer}
.toggle input{accent-color:var(--acc);width:16px;height:16px}
.srcnote{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:0 0 10px;flex-wrap:wrap}
.srcnote .dot{width:8px;height:8px;border-radius:50%;background:var(--pcb);flex:none}
.srcnote .dot.off{background:var(--faint)}
.pick{max-height:50vh;overflow:auto;border:1px solid var(--line-soft);border-radius:10px;margin-top:8px}

/* iOS Safari は 16px 未満の入力欄にフォーカスすると画面を拡大するので、入力欄はすべて 16px 以上 */
input,select,textarea{font-size:16px!important}
.form,.fld,.panel{min-width:0;max-width:100%}
.fld input,.fld select,.fld textarea{min-width:0;max-width:100%;display:block}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;max-width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=time]::-webkit-date-and-time-value{text-align:left}

/* 同期ボタン */
.iconbtn.sync{margin-right:-8px}
.iconbtn.sync .ok,.iconbtn.sync .bang{display:none}
.iconbtn.sync.ok .ok{display:inline;color:var(--pcb)}
.iconbtn.sync.ok{color:var(--pcb)}
.iconbtn.sync.syncing{color:var(--acc-ink);animation:pulse 1.2s ease-in-out infinite}
.iconbtn.sync.login,.iconbtn.sync.error{color:var(--bad)}
.iconbtn.sync.login .bang,.iconbtn.sync.error .bang{display:inline}
.iconbtn.sync.offline{color:var(--faint)}
@keyframes pulse{50%{opacity:.35}}

.fld input[readonly]{background:var(--sunken);font-family:var(--f-mono);font-weight:600;color:var(--ink)}

/* シート */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;touch-action:pan-y pinch-zoom;overscroll-behavior:contain}
.sheet .scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet .panel{position:relative;width:100%;max-width:640px;max-height:92vh;overflow-x:hidden;overflow-y:auto;touch-action:pan-y pinch-zoom;background:var(--card);
  border-radius:18px 18px 0 0;box-shadow:var(--shadow-lift);transform:translateY(24px);opacity:0;transition:transform .22s cubic-bezier(.2,.8,.2,1),opacity .2s;
  padding:8px 18px calc(18px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.sheet.open .scrim{opacity:1}
.sheet.open .panel{transform:none;opacity:1}
@media (min-width:700px){ .sheet{align-items:center} .sheet .panel{border-radius:18px;max-height:86vh;padding-bottom:18px} }
.panel .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:2px auto 10px}
.panel h2{font-size:17px;margin:0 0 14px}
.form{display:flex;flex-wrap:wrap;gap:12px}
.fld{flex:1 1 100%;display:flex;flex-direction:column;gap:5px;min-width:0}
.fld.half{flex:1 1 calc(50% - 6px)}
.fld.third{flex:1 1 calc(33% - 8px)}
.fld > span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.fld small{font-size:11.5px;color:var(--faint)}
.fld input:not([type=checkbox]),.fld select,.fld textarea,.logadd textarea,.logadd input{
  width:100%;border:1px solid var(--line);background:var(--card-2);border-radius:9px;padding:9px 11px;font-size:15px;min-height:42px}
.fld textarea,.logadd textarea{resize:vertical;line-height:1.55}
.fld input:focus,.fld select:focus,.fld textarea:focus,.logadd textarea:focus,.search input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.fld.check{flex-direction:row;align-items:center;gap:9px}
.fld.check input{width:18px;height:18px;accent-color:var(--acc)}
.fld.check > span{font-size:14px;font-weight:500;color:var(--ink);letter-spacing:0}
.formbtns{display:flex;gap:8px;margin-top:18px;align-items:center;flex-wrap:wrap}
.formbtns .sp{flex:1}
.infobox{background:var(--card-2);border:1px solid var(--line-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:14px}
.infobox b{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.infobox .ln{padding:4px 0;border-top:1px solid var(--line-soft)}
.infobox .ln:first-of-type{border-top:0}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 84px);transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:80;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.setrow{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line-soft)}
.setrow:first-child{border-top:0}
.setrow .main{flex:1;min-width:0}
.setrow .s{font-size:12.5px;color:var(--muted)}
.setrow select{border:1px solid var(--line);background:var(--card-2);border-radius:8px;padding:6px 8px}
</style>
</head>

<script>
'use strict';
/* ============================================================
   データ
   作品（builds）ごとに、仕様・部品と工具（bom）・手順（steps）・
   作業日（sessions）・メンテナンス（maint）・記録（logs）を持つ。
   ============================================================ */
var KEY = 'maker-desk-v1';
var KINDS = ['電子工作','スマートホーム','自作PC','DIY・木工','3Dプリント','修理・改造','その他'];
var STATUSES = ['アイデア','段取り中','製作中','稼働中','保留','引退'];
var ACTIVE = ['段取り中','製作中'];
/* 分類は研究デスクの台帳と同じものに、自作PC向けの「PCパーツ」を足したもの */
var INV_CATS = ['マイコン・ボード','センサ','表示・LED','モーター・駆動','電源・電池','受動部品','半導体・IC','通信モジュール','コネクタ・配線','基板・ブレッドボード','工具','計測器','材料・消耗品','その他'];
var BOM_CATS = INV_CATS.slice(0, -1).concat(['PCパーツ','その他']);
var TOOL_CATS = ['工具','計測器'];
var INUSE_CATS = ['工具','計測器','材料・消耗品'];
var PART_STATES = ['要購入','注文済み','手元にある','取り付け済み'];
var TOOL_STATES = ['要購入','注文済み','手元にある'];
var LAB_URL = '../lab-desk/';

var DB = load();
var UI = { filter:'すべて', kind:'すべて', partsQ:'', partsCat:'すべて', partsMine:false, lastRoute:'', pend:[] };

function blank(){ return { v:1, builds:[], deleted:{}, settings:{ theme:'auto' } }; }
function load(){
  try{
    var d = JSON.parse(localStorage.getItem(KEY));
    if(d && d.v) return normalize(d);
  }catch(e){}
  return blank();
}
function normalize(d){
  d.builds = Array.isArray(d.builds) ? d.builds : [];
  d.settings = d.settings || { theme:'auto' };
  d.deleted = d.deleted && typeof d.deleted === 'object' && !Array.isArray(d.deleted) ? d.deleted : {};
  d.builds.forEach(function(b){
    ['tags','specs','bom','steps','sessions','maint','logs'].forEach(function(k){ if(!Array.isArray(b[k])) b[k] = []; });
    if(STATUSES.indexOf(b.status) < 0) b.status = 'アイデア';
    if(!b.kind) b.kind = 'その他';
    b.bom.forEach(function(x){
      if(!x.role) x.role = TOOL_CATS.indexOf(x.cat) >= 0 ? 'tool' : 'part';
      if(!x.state) x.state = '要購入';
      if(x.role === 'tool' && x.state === '取り付け済み') x.state = '手元にある';
    });
    b.maint.forEach(function(m){ if(!Array.isArray(m.history)) m.history = []; });
    b.logs.forEach(function(l){ if(!Array.isArray(l.photos)) l.photos = []; });
  });
  delete d.files;
  return d;
}
function save(){
  stampChanges();
  DB.savedAt = Date.now();
  try{ localStorage.setItem(KEY, JSON.stringify(DB)); }
  catch(e){ toast('保存できませんでした（ストレージの空きを確認してください）'); }
  if(typeof syncSoon === 'function') syncSoon();
}

/* ============================================================
   小道具
   ============================================================ */
function $(s, r){ return (r || document).querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
function isoOf(d){ d = new Date(d); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
function todayISO(){ return isoOf(new Date()); }
function addDays(n){ var d = new Date(); d.setDate(d.getDate() + n); return isoOf(d); }
function addDaysTo(iso, n){ var d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return isoOf(d); }
function yen(n){ return '¥' + Math.round(+n || 0).toLocaleString('ja-JP'); }
function num(n){ return (+n || 0).toLocaleString('ja-JP'); }
function fmtDate(iso){ if(!iso) return ''; var a = iso.split('-'); return a[0] + '/' + (+a[1]) + '/' + (+a[2]); }
function fmtShort(iso){ if(!iso) return ''; var a = iso.split('-'); return (+a[1]) + '/' + (+a[2]); }
function wday(iso){ return '日月火水木金土'.charAt(new Date(iso + 'T00:00:00').getDay()); }
function daysUntil(iso){ return Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5); }
function dueLabel(iso){
  if(!iso) return { t:'日付未定', c:'' };
  var n = daysUntil(iso);
  if(n < 0) return { t: fmtShort(iso) + '（' + (-n) + '日過ぎ）', c:'over' };
  if(n === 0) return { t:'今日', c:'soon' };
  if(n === 1) return { t:'明日', c:'soon' };
  if(n <= 7) return { t: fmtShort(iso) + '（あと' + n + '日）', c:'soon' };
  return { t: fmtDate(iso), c:'' };
}
function splitTags(s){ return String(s || '').split(/[,、，\s]+/).map(function(t){ return t.trim().replace(/^#/, ''); }).filter(Boolean); }
function lines(t){ return String(t || '').split('\n').map(function(x){ return x.trim(); }).filter(Boolean); }
function normName(x){ return String(x || '').normalize('NFKC').toLowerCase().replace(/[\s・\-_\/()（）]/g, ''); }
function getB(id){ return DB.builds.find(function(b){ return b.id === id; }); }
function touch(b){ b.updatedAt = new Date().toISOString(); }
function short(t, n){ t = String(t || ''); n = n || 16; return t.length > n ? t.slice(0, n) + '…' : t; }

var toastT;
function toast(msg){
  var t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

var I = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  yen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l6 8 6-8M12 12v8M7.5 13h9M7.5 16.5h9"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  chip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="7" width="10" height="10" rx="1.5"/><path d="M10 7V4M14 7V4M10 20v-3M14 20v-3M7 10H4M7 14H4M20 10h-3M20 14h-3"/></svg>',
  wrench:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 6.5a4 4 0 0 0-5.3 5.3L4 17a1.4 1.4 0 0 0 2 2l5.2-5.2a4 4 0 0 0 5.3-5.3l-2.4 2.4-2-2z"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
  camera:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>'
};

/* ============================================================
   シート（フォーム）
   ============================================================ */
var LOCK_Y = 0;
function lockScroll(on){
  var b = document.body;
  if(on){
    if(b.classList.contains('lock')) return;
    LOCK_Y = window.scrollY; b.style.top = (-LOCK_Y) + 'px'; b.classList.add('lock');
  }else{
    if(!b.classList.contains('lock') || $('#sheet').classList.contains('open')) return;
    b.classList.remove('lock'); b.style.top = ''; window.scrollTo(0, LOCK_Y);
  }
}
function openSheet(html, onMount){
  var s = $('#sheet');
  $('#sheetBody').innerHTML = html;
  s.hidden = false;
  lockScroll(true);
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ s.classList.add('open'); }); });
  if(onMount) onMount($('#sheetBody'));
}
function closeSheet(){
  var s = $('#sheet');
  if(s.hidden) return;
  s.classList.remove('open');
  lockScroll(false);
  setTimeout(function(){ if(!s.classList.contains('open')){ s.hidden = true; $('#sheetBody').innerHTML = ''; } }, 230);
}
/* シートを閉じてから別のシートを開く */
function nextSheet(fn){ closeSheet(); setTimeout(fn, 240); }

function fieldHTML(f, v){
  var id = 'f_' + f.k, val = (v === undefined || v === null) ? (f.def !== undefined ? f.def : '') : v;
  var ph = f.ph ? ' placeholder="' + esc(f.ph) + '"' : '';
  var inp;
  if(f.type === 'textarea'){
    inp = '<textarea id="' + id + '" name="' + f.k + '" rows="' + (f.rows || 3) + '"' + ph + '>' + esc(val) + '</textarea>';
  }else if(f.type === 'select'){
    inp = '<select id="' + id + '" name="' + f.k + '">' + f.options.map(function(o){
      if(o && o.group) return '<optgroup label="' + esc(o.group) + '">' + o.items.map(function(x){ return '<option value="' + esc(x[0]) + '"' + (x[0] === val ? ' selected' : '') + '>' + esc(x[1]) + '</option>'; }).join('') + '</optgroup>';
      var ov = Array.isArray(o) ? o[0] : o, ol = Array.isArray(o) ? o[1] : o;
      return '<option value="' + esc(ov) + '"' + (ov === val ? ' selected' : '') + '>' + esc(ol) + '</option>';
    }).join('') + '</select>';
  }else if(f.type === 'check'){
    return '<label class="fld check"><input type="checkbox" id="' + id + '" name="' + f.k + '"' + (val ? ' checked' : '') + '><span>' + esc(f.label) + '</span></label>';
  }else{
    var type = f.type === 'tags' ? 'text' : (f.type || 'text');
    if(f.type === 'tags' && Array.isArray(val)) val = val.join(', ');
    var extra = type === 'number' ? ' inputmode="decimal" step="any"' : '';
    if(f.list) extra += ' list="dl_' + f.k + '"';
    inp = '<input type="' + type + '" id="' + id + '" name="' + f.k + '" value="' + esc(val) + '"' + ph + extra + (f.ro ? ' readonly tabindex="-1"' : '') + '>';
    if(f.list) inp += '<datalist id="dl_' + f.k + '">' + f.list.map(function(o){ return '<option value="' + esc(o) + '">'; }).join('') + '</datalist>';
  }
  return '<label class="fld' + (f.w ? ' ' + f.w : '') + '"><span>' + esc(f.label) + (f.req ? ' *' : '') + '</span>' + inp + (f.hint ? '<small>' + esc(f.hint) + '</small>' : '') + '</label>';
}

/* opts: title, fields, values, top(html), bottom(html), onSave(vals)→false で閉じない, onDelete, delLabel, delConfirm, mount */
function formSheet(opts){
  var v = opts.values || {};
  var html = '<h2>' + esc(opts.title) + '</h2>' + (opts.top || '') +
    '<form class="form" id="sheetForm" autocomplete="off">' +
    opts.fields.map(function(f){ return fieldHTML(f, v[f.k]); }).join('') +
    '</form>' + (opts.bottom || '') +
    '<div class="formbtns">' +
      (opts.onDelete ? '<button type="button" class="btn danger" id="sheetDel">' + esc(opts.delLabel || '削除') + '</button>' : '') +
      '<span class="sp"></span><button type="button" class="btn" data-act="closeSheet">キャンセル</button>' +
      '<button type="submit" form="sheetForm" class="btn pri">保存</button>' +
    '</div>';
  openSheet(html, function(root){
    var form = $('#sheetForm', root);
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var out = {};
      opts.fields.forEach(function(f){
        var el = form.elements[f.k];
        if(!el || f.skip) return;
        if(f.type === 'check') out[f.k] = el.checked;
        else if(f.type === 'number') out[f.k] = el.value === '' ? '' : +el.value;
        else if(f.type === 'tags') out[f.k] = splitTags(el.value);
        else out[f.k] = el.value.trim();
      });
      for(var i = 0; i < opts.fields.length; i++){
        var f = opts.fields[i];
        if(f.req && !out[f.k] && out[f.k] !== 0){ toast(f.label + 'を入力してください'); form.elements[f.k].focus(); return; }
      }
      if(opts.onSave(out) !== false) closeSheet();
    });
    if(opts.onDelete) $('#sheetDel', root).addEventListener('click', function(){
      if(confirm(opts.delConfirm || '削除しますか？')){ opts.onDelete(); closeSheet(); }
    });
    if(opts.mount) opts.mount(root, form);
    var first = form.querySelector('input:not([type=checkbox]),textarea');
    if(first && !opts.values && window.matchMedia('(pointer:fine)').matches) first.focus();
  });
}

/* ============================================================
   研究デスク（lab-desk）の部品・工具の台帳とのつながり
   ・同じブラウザなら、研究デスクのデータ（localStorage）をそのまま読む
     （どちらも kuru77.github.io にあるので同じ保存場所を見られる）
   ・Google 同期をしていれば、同じアプリ専用領域にある lab-desk.json も読む
     （ホーム画面に追加した iPhone はアプリごとに保存場所が分かれるため）
   ・どちらもなければ、研究デスクのバックアップ JSON を読み込める
   台帳は読むだけで、こちらから書き換えることはない。
   作品の部品は invId で台帳の部品を指し、研究デスク側も同じ方法で
   「自作デスクのどの作品で使っているか」をたどれる。
   ============================================================ */
var LAB_KEY = 'lab-desk-v1', LAB_CACHE = 'maker-desk-lab';
var LAB = { db:null, src:'', at:0, got:0 };

function labStamp(d){
  var m = 0;
  function t(r){ if(r && +r._u > m) m = +r._u; }
  (d.inventory || []).forEach(function(i){ t(i); (i.purchases || []).forEach(t); });
  (d.projects || []).forEach(function(p){ t(p); (p.uses || []).forEach(t); });
  return m;
}
/* 台帳と、使用数の計算に要る研究の備品だけを残す */
function slimLab(d){
  return {
    inventory: (d.inventory || []).filter(function(i){ return i && i.id; }),
    projects: (d.projects || []).map(function(p){ return { id:p.id, title:p.title, status:p.status, _u:p._u, uses:(p.uses || []).map(function(u){ return { id:u.id, invId:u.invId, qty:u.qty, usedN:u.usedN, used:u.used, usedDate:u.usedDate, _u:u._u }; }) }; })
  };
}
function loadLab(){
  var c = [];
  try{
    var d = JSON.parse(localStorage.getItem(LAB_KEY));
    if(d && Array.isArray(d.inventory)) c.push({ db:slimLab(d), src:'local', at:labStamp(d), got:Date.now() });
  }catch(e){}
  try{
    var k = JSON.parse(localStorage.getItem(LAB_CACHE));
    if(k && k.db && Array.isArray(k.db.inventory)) c.push({ db:k.db, src:k.src, at:labStamp(k.db), got:k.got || 0 });
  }catch(e){}
  c.sort(function(a, b){ return (b.at - a.at) || (a.src === 'local' ? -1 : 1); });
  LAB = c[0] || { db:null, src:'', at:0, got:0 };
}
function setLabCache(d, src){
  try{ localStorage.setItem(LAB_CACHE, JSON.stringify({ db:slimLab(d), src:src, got:Date.now() })); }catch(e){}
  loadLab();
}
function labSrcLabel(){
  if(!LAB.db) return '研究デスクの台帳はまだ読み込まれていません';
  var s = { local:'この端末の研究デスクから', drive:'Google ドライブの同期データから', file:'バックアップファイルから' }[LAB.src] || '';
  return s + '読み込み中' + (LAB.at ? '（研究デスクの最終更新 ' + agoLabel(LAB.at) + '）' : '');
}
function labInv(){ return LAB.db ? LAB.db.inventory : []; }
function labItem(id){ return id ? labInv().find(function(i){ return i.id === id; }) : null; }
function labIsTool(it){ return !!it && ((it.useMode) || (INUSE_CATS.indexOf(it.category) >= 0 ? 'inuse' : 'consume')) === 'inuse'; }
function lUseQ(u){ return Math.max(1, +u.qty || 1); }
function lUseN(u){ var n = u.usedN != null ? +u.usedN : (u.used ? lUseQ(u) : 0); return Math.max(0, Math.min(lUseQ(u), n || 0)); }
/* 研究での使用（研究デスクの研究ページで登録したもの） */
function labUsesOf(invId){
  var out = [];
  if(LAB.db) LAB.db.projects.forEach(function(p){ (p.uses || []).forEach(function(u){ if(u.invId === invId) out.push({ p:p, u:u }); }); });
  return out;
}
/* 自作デスクの作品で取り付け済みにした数（部品として使い切るもの） */
function makerInstalled(invId){
  var n = 0;
  DB.builds.forEach(function(b){ b.bom.forEach(function(x){ if(x.invId === invId && x.role !== 'tool' && x.state === '取り付け済み') n += Math.max(1, +x.qty || 1); }); });
  return n;
}
function makerUsesOf(invId){
  var out = [];
  DB.builds.forEach(function(b){ b.bom.forEach(function(x){ if(x.invId === invId) out.push({ b:b, x:x }); }); });
  return out;
}
/* 研究デスクと同じ考え方で数える。部品：未使用 = 総数 − 研究で使用済み − 作品に取り付け済み。
   工具：空き = 総数 − 進行中の研究で使用中 */
function labUsedQty(it){
  if(labIsTool(it)) return 0;
  var n = 0;
  labUsesOf(it.id).forEach(function(x){ n += lUseN(x.u); });
  return n + makerInstalled(it.id);
}
function labInUseQty(it){
  if(!labIsTool(it)) return 0;
  var n = 0;
  labUsesOf(it.id).forEach(function(x){ if(x.p.status !== '完了') n += lUseN(x.u); });
  return n;
}
function labUnused(it){ return Math.max(0, (+it.qty || 0) - labUsedQty(it) - labInUseQty(it)); }
function labLow(it){ return it.minQty !== '' && it.minQty != null && labUnused(it) <= +it.minQty; }
function labLink(id){ return LAB_URL + '#/inv/' + encodeURIComponent(id); }
/* 品名・型番から台帳の同じ部品を探す（全角半角・空白・記号の違いは無視） */
function matchLab(name, model){
  var inv = labInv();
  if(!inv.length) return '';
  var n = normName(name), mo = normName(model);
  if(n.length < 2 && mo.length < 3) return '';
  var hit = inv.find(function(it){
    var a = normName(it.name), m = normName(it.model);
    if(mo && m && mo === m) return true;
    return a === n || a + m === n || m + a === n || (mo && a + m === n + mo);
  });
  if(!hit) hit = inv.find(function(it){ var m = normName(it.model); return m.length >= 3 && (n.indexOf(m) >= 0 || (mo && mo.indexOf(m) >= 0)); });
  return hit ? hit.id : '';
}
function labOptions(){
  var list = labInv().slice().sort(function(a, b){ return (a.category || '').localeCompare(b.category || '', 'ja') || a.name.localeCompare(b.name, 'ja'); });
  var groups = {};
  list.forEach(function(i){ (groups[i.category || 'その他'] = groups[i.category || 'その他'] || []).push([i.id, i.name + (i.model ? ' ' + i.model : '') + '（' + (labIsTool(i) ? '空き ' : '未使用 ') + num(labUnused(i)) + (i.unit || '個') + '）']); });
  return [['', 'つながない']].concat(Object.keys(groups).map(function(g){ return { group:g, items:groups[g] }; }));
}

/* ============================================================
   作品の集計
   ============================================================ */
function isToolX(x){ return x.role === 'tool'; }
function haveIt(x){ return x.state === '手元にある' || x.state === '取り付け済み'; }
function bomCost(b){ return b.bom.reduce(function(s, x){ return s + (x.price === '' || x.price == null ? 0 : +x.price * Math.max(1, +x.qty || 1)); }, 0); }
function toBuyCost(list){ return list.reduce(function(s, x){ return s + (x.price === '' || x.price == null ? 0 : +x.price * Math.max(1, +x.qty || 1)); }, 0); }
function stepProg(b){
  var n = b.steps.length, d = b.steps.filter(function(s){ return s.done; }).length;
  return { n:n, d:d, pct: n ? Math.round(d / n * 100) : (b.status === '稼働中' || b.status === '引退' ? 100 : 0) };
}
function readiness(b){
  var n = b.bom.length, d = b.bom.filter(haveIt).length;
  return { n:n, d:d };
}
function upcomingSessions(b){
  return b.sessions.filter(function(s){ return !s.done; }).sort(function(a, c){ return ((a.date || '9999') + (a.start || '')) < ((c.date || '9999') + (c.start || '')) ? -1 : 1; });
}
function maintDue(b, m){
  if(!(+m.every > 0)) return '';
  var base = m.last || b.doneDate || (b.createdAt || '').slice(0, 10) || todayISO();
  return addDaysTo(base, +m.every);
}
/* 研究デスクの在庫で足りるのに「要購入」になっているもの */
function coveredByLab(x){
  var it = labItem(x.invId);
  return !!(it && x.state === '要購入' && labUnused(it) >= Math.max(1, +x.qty || 1));
}
function unlinkedMatches(b){
  if(!LAB.db) return [];
  return b.bom.filter(function(x){ return !x.invId && !x.noLab && matchLab(x.name, x.model); });
}

/* ============================================================
   写真（記録に添える）
   本体は IndexedDB、localStorage には写真のキーだけ。サムネイルは キー + '_t'。
   ============================================================ */
var FILES = (function(){
  var dbp;
  function open(){
    if(!dbp) dbp = new Promise(function(res, rej){
      var r = indexedDB.open('maker-desk-files', 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore('files'); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
    return dbp;
  }
  function tx(mode, fn){
    return open().then(function(db){
      return new Promise(function(res, rej){
        var t = db.transaction('files', mode), req = fn(t.objectStore('files'));
        t.oncomplete = function(){ res(req ? req.result : undefined); };
        t.onerror = t.onabort = function(){ rej(t.error); };
      });
    });
  }
  return {
    put: function(k, v){ return tx('readwrite', function(s){ return s.put(v, k); }); },
    get: function(k){ return tx('readonly', function(s){ return s.get(k); }); },
    del: function(k){ return tx('readwrite', function(s){ return s.delete(k); }); },
    keys: function(){ return tx('readonly', function(s){ return s.getAllKeys(); }); },
    clear: function(){ return tx('readwrite', function(s){ return s.clear(); }); }
  };
})();
var URLS = {};
function fileURL(k){
  if(!k) return Promise.resolve('');
  if(URLS[k]) return Promise.resolve(URLS[k]);
  return FILES.get(k).then(function(b){ return b ? (URLS[k] = URL.createObjectURL(b)) : ''; }).catch(function(){ return ''; });
}
function forgetURLs(){ Object.keys(URLS).forEach(function(k){ URL.revokeObjectURL(URLS[k]); }); URLS = {}; }
function hydrate(root){
  (root || document).querySelectorAll('img[data-img]').forEach(function(im){
    fileURL(im.dataset.img).then(function(u){ if(u) im.src = u; });
  });
}
function loadImg(blob){
  return new Promise(function(res, rej){
    var u = URL.createObjectURL(blob), im = new Image();
    im.onload = function(){ res(im); };
    im.onerror = function(){ URL.revokeObjectURL(u); rej(new Error('画像を読み込めませんでした')); };
    im.src = u;
  });
}
function scaled(im, max, q){
  var w = im.naturalWidth || 1200, h = im.naturalHeight || 900, sc = Math.min(1, max / Math.max(w, h));
  var c = document.createElement('canvas'); c.width = Math.round(w * sc); c.height = Math.round(h * sc);
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
  return new Promise(function(res){ c.toBlob(res, 'image/jpeg', q); });
}
/* iPhone の写真は 1 枚 3〜5MB あるので、長辺 1800px に縮めて保存する */
function preparePhoto(file){
  return loadImg(file).then(function(im){
    return Promise.all([scaled(im, 1800, .85), scaled(im, 420, .8)]).then(function(r){
      return { full:r[0], thumb:r[1], url:im.src };
    });
  });
}
var STORING = 0;
function storePhotos(pend){
  STORING++;
  setTimeout(function(){ STORING = Math.max(0, STORING - 1); }, 15000);
  return Promise.all(pend.map(function(p){
    var k = uid();
    return Promise.all([FILES.put(k, p.full), FILES.put(k + '_t', p.thumb)]).then(function(){ return k; });
  })).then(function(keys){ try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){} return keys; });
}
function dropPhoto(k){
  [k, k + '_t'].forEach(function(x){ FILES.del(x).catch(function(){}); if(URLS[x]){ URL.revokeObjectURL(URLS[x]); delete URLS[x]; } });
}
function coverOf(b){
  var ls = b.logs.filter(function(l){ return l.photos.length; }).sort(function(a, c){ return (c.date || '') > (a.date || '') ? 1 : -1; });
  return ls.length ? ls[0].photos[0] : '';
}
function lightbox(k){
  var lb = $('#lightbox'), img = $('#lbImg');
  img.removeAttribute('src');
  fileURL(k).then(function(u){ if(u){ img.src = u; lb.hidden = false; } else toast('写真がこの端末にありません（同期の完了を待ってください）'); });
}

/* ============================================================
   端末間の同期（Google ドライブのアプリ専用領域）
   研究デスクと同じ方式・同じ OAuth クライアント。同じクライアントなので
   アプリ専用領域も研究デスクと共通になり、研究デスクの lab-desk.json を
   読んで台帳を取り込める（書き換えはしない）。
   こちらのファイルは maker-desk.json と、写真の mk-<キー>。
   研究デスクの画像（f-…）には触らない。

var GOOGLE_CLIENT_ID = '1088975026923-gg6ra210l32ql6g7hllg6i11qei8agm9.apps.googleusercontent.com';
var KIDS = ['bom','steps','sessions','maint','logs'];
var SHADOW = {};

function eachRecord(db, fn){
  (db.builds || []).forEach(function(b){
    fn(b, KIDS);
    KIDS.forEach(function(k){ (b[k] || []).forEach(function(c){ fn(c, []); }); });
  });
}
function recSig(rec, kids){
  var o = {};
  Object.keys(rec).sort().forEach(function(k){ if(k !== '_u' && kids.indexOf(k) < 0) o[k] = rec[k]; });
  return JSON.stringify(o);
}
function rebuildShadow(){
  SHADOW = {};
  eachRecord(DB, function(r, kids){ if(r.id){ if(!r._u) r._u = 1; SHADOW[r.id] = recSig(r, kids); } });
}
function stampChanges(){
  var now = Date.now(), seen = {};
  eachRecord(DB, function(r, kids){
    if(!r.id) return;
    seen[r.id] = 1;
    var sg = recSig(r, kids);
    if(SHADOW[r.id] !== sg){ r._u = now; SHADOW[r.id] = sg; }
  });
  Object.keys(SHADOW).forEach(function(id){
    if(!seen[id]){ DB.deleted[id] = now; delete SHADOW[id]; }
  });
}
function mergeList(a, b, del, kids){
  var out = [], byB = {}, used = {};
  (b || []).forEach(function(r){ if(r && r.id) byB[r.id] = r; });
  function keep(r){ return !(del[r.id] && del[r.id] >= (r._u || 0)); }
  function one(x, y){
    var w = (y && (y._u || 0) > (x._u || 0)) ? y : x;
    var m = Object.assign({}, w);
    kids.forEach(function(k){ m[k] = mergeList(x[k] || [], (y && y[k]) || [], del, []); });
    return m;
  }
  (a || []).forEach(function(r){
    if(!r || !r.id) return;
    var o = byB[r.id]; used[r.id] = 1;
    var m = one(r, o || null);
    if(keep(m)) out.push(m);
  });
  (b || []).forEach(function(r){
    if(!r || !r.id || used[r.id]) return;
    var m = one(r, null);
    if(keep(m)) out.push(m);
  });
  return out;
}
function mergeDB(a, b){
  var del = {};
  [a.deleted || {}, b.deleted || {}].forEach(function(d){ Object.keys(d).forEach(function(id){ del[id] = Math.max(del[id] || 0, d[id]); }); });
  return { builds: mergeList(a.builds, b.builds, del, KIDS), deleted: del };
}
function syncPayload(db){
  var del = {};
  Object.keys(db.deleted || {}).sort().forEach(function(k){ del[k] = db.deleted[k]; });
  return JSON.stringify({ v:1, app:'maker-desk', builds:db.builds || [], deleted:del });
}

var DRIVE = 'https://www.googleapis.com/drive/v3/files', UPLOAD = 'https://www.googleapis.com/upload/drive/v3/files';
function gfetch(url, opts){

  return fetch(url, opts).then(function(r){
    if(!r.ok){ var e = new Error('Google ドライブ ' + r.status); e.status = r.status; throw e; }
    return r;

}
function driveList(){

    return gfetch(u).then(function(r){ return r.json(); }).then(function(j){
      all = all.concat(j.files || []);

    });
  }
  return page('');
}
function driveGet(id){ return gfetch(DRIVE + '/' + id + '?alt=media'); }

  var blob = new Blob(['--' + b + '\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n' + meta + '\r\n--' + b + '\r\nContent-Type: ' + (type || 'application/octet-stream') + '\r\n\r\n', body, '\r\n--' + b + '--']);

function agoLabel(t){

/* 研究デスクの同期ファイルを読む（読むだけ。失敗しても同期は続ける） */
function pullLab(files){
  var lf = files.filter(function(x){ return x.name === 'lab-desk.json'; })
    .sort(function(a, b){ return (b.modifiedTime || '') > (a.modifiedTime || '') ? 1 : -1; })[0];
  if(!lf) return Promise.resolve(false);
  return driveGet(lf.id).then(function(r){ return r.json(); }).then(function(d){
    if(!d || !Array.isArray(d.inventory)) return false;
    var before = LAB.at;
    setLabCache(d, 'drive');
    return LAB.at !== before;
  }).catch(function(){ return false; });
}
function syncNow(interactive){
  if(!clientId() || !SM.signedIn){ if(interactive) login(false); return Promise.resolve(); }
  if(!tokenOK()){
    if(interactive) login(false);
    else setSyncState('login');
    return Promise.resolve();
  }
  if(!navigator.onLine){ setSyncState('offline'); return Promise.resolve(); }
  if(SYNC.running){ SYNC.again = true; return Promise.resolve(); }
  if(uiBusy()){ syncSoon(4000); return Promise.resolve(); }
  SYNC.running = true; setSyncState('syncing');
  var changedView = false;
  return driveList().then(function(files){
    var jsons = files.filter(function(x){ return x.name === 'maker-desk.json'; });
    var remote = null, remoteStr = '';
    return pullLab(files).then(function(labChanged){
      if(labChanged) changedView = true;
      return jsons.reduce(function(pr, fl){
        return pr.then(function(){ return driveGet(fl.id).then(function(r){ return r.json(); }).then(function(d){
          remote = remote ? mergeDB(remote, d) : d;
        }); });
      }, Promise.resolve());
    }).then(function(){
      if(remote){
        remoteStr = syncPayload(remote);
        if(uiBusy()){ var e = new Error('busy'); e.busy = true; throw e; }
        stampChanges();
        var m = mergeDB(DB, remote);
        if(syncPayload(m) !== syncPayload(DB)){
          SYNC.applying = true;
          DB.builds = m.builds; DB.deleted = m.deleted;
          normalize(DB); rebuildShadow(); save();
          SYNC.applying = false;
          changedView = true;
        }
      }
      return syncFiles(files).then(function(dl){ if(dl) changedView = true; });
    }).then(function(){
      var mine = syncPayload(DB);
      var w;
      if(!jsons.length) w = driveCreate('maker-desk.json', mine, 'application/json');
      else if(mine !== remoteStr || jsons.length > 1) w = driveUpdate(jsons[0].id, mine, 'application/json');
      return Promise.resolve(w).then(function(){
        return Promise.all(jsons.slice(1).map(function(x){ return driveDelete(x.id); }));
      });
    });
  }).then(function(){
    SM.last = Date.now(); saveSM();
    setSyncState('ok');
    if(changedView && !uiBusy()) render(true);
  }).catch(function(e){
    SYNC.applying = false;
    if(e.busy){ syncSoon(4000); setSyncState('ok'); }
    else if(e.status === 401 || e.status === 403){ SM.token = ''; SM.exp = 0; saveSM(); setSyncState('login'); }
    else if(!navigator.onLine) setSyncState('offline');
    else setSyncState('error', e.message || '通信エラー');
  }).then(function(){
    SYNC.running = false;
    if(SYNC.again){ SYNC.again = false; syncSoon(500); }
  });
}
/* 写真：無いほうへ送る。どの記録からも使われなくなったものは片づける（mk- のものだけ） */
function syncFiles(files){
  var remote = {};
  files.forEach(function(x){ if(x.name.indexOf('mk-') === 0) remote[x.name.slice(3)] = x; });
  var need = {};
  DB.builds.forEach(function(b){ b.logs.forEach(function(l){ l.photos.forEach(function(k){ need[k] = 1; need[k + '_t'] = 1; }); }); });
  var downloaded = 0;
  return FILES.keys().then(function(localKeys){
    var local = {}; localKeys.forEach(function(k){ local[k] = 1; });
    var up = Object.keys(need).filter(function(k){ return local[k] && !remote[k]; });
    var down = Object.keys(need).filter(function(k){ return !local[k] && remote[k]; });
    var total = up.length + down.length, done = 0;
    function tick(){ done++; setSyncState('syncing', '写真 ' + done + '/' + total); }
    var chain = Promise.resolve();
    up.forEach(function(k){ chain = chain.then(function(){ return FILES.get(k).then(function(b){ return b ? driveCreate('mk-' + k, b, b.type) : null; }).then(tick); }); });
    down.forEach(function(k){ chain = chain.then(function(){ return driveGet(remote[k].id).then(function(r){ return r.blob(); }).then(function(b){ downloaded++; return FILES.put(k, b); }).then(tick); }); });
    return chain.then(function(){
      var dayAgo = Date.now() - 864e5;
      var gcRemote = Object.keys(remote).filter(function(k){ return !need[k] && new Date(remote[k].createdTime).getTime() < dayAgo; });
      var gcLocal = STORING ? [] : localKeys.filter(function(k){ return !need[k]; });
      gcLocal.forEach(function(k){ FILES.del(k).catch(function(){}); if(URLS[k]){ URL.revokeObjectURL(URLS[k]); delete URLS[k]; } });
      return Promise.all(gcRemote.map(function(k){ return driveDelete(remote[k].id); }));
    }).then(function(){ return downloaded; });
  });
}

/* ============================================================
   カレンダー（.ics）— FirstSeed カレンダーなどに「追加」で取り込む
   ============================================================ */
function pad2(n){ return (n < 10 ? '0' : '') + n; }
function icsEsc(s){ return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n'); }
var ENC = window.TextEncoder ? new TextEncoder() : null;
function fold(line){
  var out = [], cur = '', len = 0, max = 73;
  Array.from(line).forEach(function(ch){
    var n = ENC ? ENC.encode(ch).length : 3;
    if(len + n > max){ out.push(cur); cur = ''; len = 0; max = 72; }
    cur += ch; len += n;
  });
  out.push(cur);
  return out.join('\r\n ');
}
function stampUTC(d){ return d.getUTCFullYear() + pad2(d.getUTCMonth() + 1) + pad2(d.getUTCDate()) + 'T' + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z'; }
/* カレンダーに送れるもの：これからの作業日と、120 日以内のメンテナンス */
function calItems(){
  var out = [], lim = addDays(120), today = todayISO();
  DB.builds.forEach(function(b){
    b.sessions.forEach(function(s){
      if(s.done || !s.date || s.date < today) return;
      var sig = [s.date, s.start, s.end, s.title, s.note].join('|');
      out.push({ kind:'session', b:b, x:s, date:s.date, start:s.start, end:s.end, title:s.title || ('作業：' + b.title), desc:(s.note ? s.note + '\n\n' : '') + '自作デスク：' + b.title, sig:sig, sent: s.sentSig === sig, uid:'maker-s-' + s.id });
    });
    if(b.status !== '稼働中') return;
    b.maint.forEach(function(m){
      var due = maintDue(b, m);
      if(!due || due > lim) return;
      var d = due < today ? today : due;
      var sig = [d, m.title].join('|');
      out.push({ kind:'maint', b:b, x:m, date:d, title:'メンテ：' + m.title + '（' + b.title + '）', desc:(m.note ? m.note + '\n\n' : '') + m.every + '日ごと ・ 自作デスク：' + b.title, sig:sig, sent: m.sentSig === sig, uid:'maker-m-' + m.id + '-' + d.replace(/-/g, '') });
    });
  });
  return out.sort(function(a, b){ return (a.date + (a.start || '')) < (b.date + (b.start || '')) ? -1 : 1; });
}
function buildICS(list){
  var now = stampUTC(new Date());
  var L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//KURU77//maker-desk//JA','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:自作デスク','X-WR-TIMEZONE:Asia/Tokyo',
    'BEGIN:VTIMEZONE','TZID:Asia/Tokyo','BEGIN:STANDARD','DTSTART:19700101T000000','TZOFFSETFROM:+0900','TZOFFSETTO:+0900','TZNAME:JST','END:STANDARD','END:VTIMEZONE'];
  list.forEach(function(e){
    L.push('BEGIN:VEVENT', 'UID:' + e.uid + '@kuru77.github.io', 'DTSTAMP:' + now);
    if(e.start){
      var endDate = e.end && e.end > e.start ? e.date : addDaysTo(e.date, e.end ? 1 : 0);
      var end = e.end || e.start;
      L.push('DTSTART;TZID=Asia/Tokyo:' + e.date.replace(/-/g, '') + 'T' + e.start.replace(':', '') + '00');
      L.push('DTEND;TZID=Asia/Tokyo:' + endDate.replace(/-/g, '') + 'T' + end.replace(':', '') + '00');
    }else{
      L.push('DTSTART;VALUE=DATE:' + e.date.replace(/-/g, ''), 'DTEND;VALUE=DATE:' + addDaysTo(e.date, 1).replace(/-/g, ''));
    }
    L.push('SUMMARY:' + icsEsc(e.title), 'DESCRIPTION:' + icsEsc(e.desc), 'CATEGORIES:' + icsEsc(e.kind === 'maint' ? 'メンテナンス' : '自作'), 'TRANSP:' + (e.start ? 'OPAQUE' : 'TRANSPARENT'), 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.map(fold).join('\r\n') + '\r\n';
}

function partsListHTML(mine){

$('#importFile').addEventListener('change', function(e){
  var f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  var rd = new FileReader();
  rd.onload = function(){
    try{
      var d = JSON.parse(rd.result);
      if(d && Array.isArray(d.inventory) && Array.isArray(d.projects) && !d.builds){ toast('これは研究デスクのバックアップです。「研究デスクとの連携」から読み込んでください'); return; }
      if(!d || !d.v || !Array.isArray(d.builds)) throw new Error('形式が違います');
      if(!confirm('作品 ' + d.builds.length + ' 件を読み込み、いまのデータを置き換えます。よろしいですか？')) return;
      var files = d.files || {};
      toast('読み込み中…');
      FILES.clear().then(function(){
        return Promise.all(Object.keys(files).map(function(k){ return fetch(files[k]).then(function(r){ return r.blob(); }).then(function(b){ return FILES.put(k, b); }); }));
      }).then(function(){
        forgetURLs(); DB = normalize(d); save(); applyTheme(); location.hash = '#/'; render(false); toast('読み込みました');
      }).catch(function(){ toast('写真の読み込みに失敗しました'); });

function showUsage(){
  if(!navigator.storage || !navigator.storage.estimate) return;
  navigator.storage.estimate().then(function(e){
    var el = $('#usage'); if(el && e.usage != null) el.textContent += ' ・ 写真を含む全体 ' + (e.usage > 1e6 ? (e.usage / 1e6).toFixed(1) + ' MB' : Math.round(e.usage / 1e3) + ' KB');
  }).catch(function(){});
}
function blobToDataURL(b){
  return new Promise(function(res, rej){ var r = new FileReader(); r.onload = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; r.readAsDataURL(b); });
}
function csv(rows){
  return '\ufeff' + rows.map(function(r){
    return r.map(function(c){ c = c == null ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(',');
  }).join('\r\n');
}
function download(name, text, type){
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:type + ';charset=utf-8' }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
function copyText(text, msg){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(msg); }, fallback);
  }else fallback();
  function fallback(){
    var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select();
    try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('コピーできませんでした'); }
    t.remove();
  }
}
